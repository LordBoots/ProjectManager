<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDD Viewer</title>
    <link rel="stylesheet" href="Framework/CSS/page.css">
    <link rel="stylesheet" href="Framework/CSS/region.css">
    <link rel="stylesheet" href="Framework/CSS/textblock.css">
    <link rel="stylesheet" href="Framework/CSS/table.css">
    <link rel="stylesheet" href="Framework/CSS/separator.css">
    <link rel="stylesheet" href="Framework/CSS/link.css">
    <link rel="stylesheet" href="Framework/CSS/image.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        #top-nav {
            height: 50px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
        }

        #top-nav button {
            background-color: #404040;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        #top-nav button:hover:not(:disabled) {
            background-color: #505050;
        }

        #top-nav button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #top-nav .nav-separator {
            width: 1px;
            height: 30px;
            background-color: #404040;
        }

        #top-nav .current-page {
            flex: 1;
            font-size: 14px;
            color: #4a9eff;
            font-weight: bold;
            text-align: center;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: calc(100% - 50px);
        }

        #sidebar {
            flex: 0 0 auto;
            width: 250px;
            background-color: #2d2d2d;
            border-right: 1px solid #404040;
            overflow-y: auto;
        }

        #content-area {
            flex: 1 1 auto;
            overflow-y: auto;
            background-color: #1a1a1a;
            padding: 20px;
        }

        #extras-panel {
            flex: 0 0 auto;
            width: 0;
            background-color: #2d2d2d;
            border-left: 1px solid #404040;
            overflow-y: auto;
            transition: width 0.3s ease;
        }

        #extras-panel.open {
            width: 300px;
        }
        
        /* Force teal color for table headers - fallback */
        th.table-header-cell,
        .table th,
        .table thead th {
            color: #4dd0e1 !important;
        }
    </style>
</head>
<body>
    <div id="top-nav">
        <button id="nav-back" title="Go back">← Back</button>
        <button id="nav-forward" title="Go forward">Forward →</button>
        <div class="nav-separator"></div>
        <div id="current-page" class="current-page"></div>
    </div>
    <div id="app-container">
        <div id="sidebar"></div>
        <div id="content-area"></div>
        <div id="extras-panel"></div>
    </div>
    
    <script type="module" src="Framework/main.js"></script>
</body>
</html>
